name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    name: markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: markdownlint
        run: npx --yes markdownlint-cli2 "**/*.md"

  relative-links:
    name: relative links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check in-repo links resolve
        run: python3 .github/scripts/check_relative_links.py

  site:
    name: site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet pyyaml markdown

      # data/boards.yml is the source of truth for the README's board section.
      # This fails if someone edited one without regenerating the other.
      - name: README board section is in sync with data/boards.yml
        run: python3 scripts/build.py --check

      - name: Build site
        run: python3 scripts/build.py --site-only

      - name: Check internal links and anchors
        run: python3 scripts/check_site.py
