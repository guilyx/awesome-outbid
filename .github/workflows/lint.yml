name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    name: markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: markdownlint
        run: npx --yes markdownlint-cli2 "**/*.md"

  relative-links:
    name: relative links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check in-repo links resolve
        run: python3 .github/scripts/check_relative_links.py
