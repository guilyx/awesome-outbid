name: pages

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'best-practices/**'
      - 'site/**'
      - 'scripts/build.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # contributors() reads `git log`; a shallow clone knows one commit and
          # would render a wall of one person forever.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet pyyaml markdown

      - name: Build site
        run: python3 scripts/build.py --site-only

      - name: Check internal links and anchors
        run: python3 scripts/check_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
